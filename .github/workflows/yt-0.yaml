name: First Sample Workflow

on:
    push

jobs:
    first-job:
        name: 'First-Job'
        runs-on: 'ubuntu-latest'
        steps:
            - name: 'Printing hello world'
              run: |
                    echo "Hello, world!"        
    second-job:
        name: 'Second-Job'
        runs-on: 'ubuntu-latest'
        steps:
            - name: 'Printing the runner name'
              run: |
                    echo "Runner on which this job & Step is running:$RUNNER_NAME"
                    echo "Os of the runner: $RUNNER_OS"
